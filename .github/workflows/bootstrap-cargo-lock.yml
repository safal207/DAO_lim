name: Bootstrap Cargo.lock

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.head_ref == 'agent/commit-cargo-lock'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate and verify evidence-pinned lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo '7e2ae97568c1793132ea572f374c24c9235f3642c85b61aaa55163a628b62d5f  Cargo.lock' | sha256sum -c -

      - name: Commit lockfile and remove one-shot bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bootstrap-cargo-lock.yml
          git add Cargo.lock .github/workflows/bootstrap-cargo-lock.yml
          git commit -m 'build: commit evidence-pinned Cargo.lock'
          git push origin HEAD:${{ github.head_ref }}
